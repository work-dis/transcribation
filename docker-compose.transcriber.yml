services:
  transcriber-bot:
    build:
      context: .
      dockerfile: Dockerfile.transcriber
    restart: unless-stopped
    env_file:
      - .env.transcriber
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    volumes:
      - transcriber-data:/data
    mem_limit: 384m
    cpus: 0.50

volumes:
  transcriber-data:
