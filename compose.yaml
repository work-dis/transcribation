services:
  api:
    build: .
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  worker:
    build: .
    command: python -m apps.worker.main
    env_file: .env
    depends_on: [postgres, redis]
  telegram-bot:
    build: .
    command: python apps/telegram-bot/main.py
    env_file: .env
    depends_on: [api]
  telegram-recorder:
    build: .
    command: python apps/telegram-recorder/main.py
    env_file: .env
    depends_on: [api]
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./apps/web:/app"]
    command: sh -c "npm install && npm run dev"
    ports: ["3000:5173"]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: conversation_ai, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
volumes: {pgdata: {}}
