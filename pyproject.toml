[project]
name = "conversation-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1", "aiosqlite>=0.20,<1", "alembic>=1.13,<2", "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1", "python-multipart>=0.0.12,<1", "redis>=5,<6", "arq>=0.26,<1",
  "aiogram>=3.15,<4", "cryptography>=43,<44"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "mypy>=1.13,<2", "aiosqlite>=0.20,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
